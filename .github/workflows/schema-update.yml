name: generated files

on:
  pull_request:
    paths:
      - "foundation/**"
      - "internal/config/**"
      - "internal/providerplugin/manifest/**"
      - "internal/cmd/schema.go"
      - "internal/swagger/**"
      - "main.go"
      - "schema.json"
      - "provider-plugin.schema.json"
      - "provider-preset-plugin.schema.json"
      - "image-provider-plugin.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go run . schema > schema.json
      - run: go run . schema provider-plugin > provider-plugin.schema.json
      - run: go run . schema provider-preset-plugin > provider-preset-plugin.schema.json
      - run: go run . schema image-provider-plugin > image-provider-plugin.schema.json
      - run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo main.go --dir . --output internal/swagger --packageName swagger --parseDependency --parseInternal --parseDepth 5
      - run: git diff --exit-code
