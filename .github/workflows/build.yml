name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds the module on every platform crux ships for (see .goreleaser.yml
  # goos list) and, on Linux only, verifies go.mod/go.sum are tidy before
  # compiling. This job is allowed to fail the workflow.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod/go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code

      - name: Build
        run: go build ./...
