name: CodeQL

# CodeQL scans both Go source and the workflow files themselves (the
# "actions" language), so unlike security.yml it must still run when only
# .github/workflows/** changes. Asset-only changes (images, gifs) are still
# skipped since they can't introduce a code or workflow vulnerability.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "docs/assets/**"
  pull_request:
    paths-ignore:
      - "assets/**"
      - "docs/assets/**"
  workflow_dispatch:
  schedule:
    # Nightly, independent of push/PR activity.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  # CodeQL for this repo's real languages: Go source and the GitHub Actions
  # workflows themselves.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
