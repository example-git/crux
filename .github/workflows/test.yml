name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Non-race tests run on every push/PR by default: they're quicker and far
  # more stable than the race-instrumented suite. They never fail the
  # workflow: crux's test suite includes platform-sensitive integration
  # tests (headless auth, daemon/session recovery, VCR-recorded agent runs)
  # whose flakiness on hosted runners shouldn't block merges. For the race
  # detector, see test-race.yml (manually triggered only).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
