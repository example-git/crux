name: Security

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "assets/**"
      - "docs/assets/**"
  workflow_dispatch:
  schedule:
    # Nightly, independent of push/PR activity.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  # Go-specific known-vulnerability scan against the module graph and
  # standard library used by go.mod.
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  # Filesystem vulnerability scan (dependencies, misconfigurations) with
  # SARIF uploaded to the Security tab.
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

  # Blocks pull requests that introduce newly-known-vulnerable or
  # disallowed-license dependencies. Only meaningful with a base ref to diff
  # against, so it is gated to pull_request.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
