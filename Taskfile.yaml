# https://taskfile.dev

version: "3"

vars:
  VERSION:
    sh: git describe --long 2>/dev/null || echo ""
  RACE:
    sh: test -f race.log && echo "1" || echo ""

env:
  CGO_ENABLED: 0
  GOEXPERIMENT: greenteagc

tasks:
  lint:install:
    desc: Install golangci-lint
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    env:
      GOTOOLCHAIN: go1.25.0

  lint:
    desc: Run base linters
    cmds:
      - task: lint:log
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m
    env:
      GOEXPERIMENT: null

  lint:log:
    desc: Check that log messages start with capital letters
    cmds:
      - ./scripts/check_log_capitalization.sh

  lint:fix:
    desc: Run base linters and fix issues
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m --fix
    env:
      GOEXPERIMENT: null

  build:
    desc: Run build
    vars:
      LDFLAGS: '{{if .VERSION}}-ldflags="-X github.com/example-git/crux/internal/version.Version={{.VERSION}}"{{end}}'
    cmds:
      - "go build -v {{if .RACE}}-race{{end}} {{.LDFLAGS}} ."
    sources:
      - ./**/*.go
      - go.mod
      - internal/agent/**/*.md
      - internal/agent/**/*.md.tpl
    generates:
      - crux{{exeExt}}

  build:core-only:
    desc: Build with only core-owned provider capabilities
    cmds:
      - go build -v -o crux-core-only{{exeExt}} -ldflags="-X github.com/example-git/crux/internal/config.DefaultProviderProfile=core-only" .

  build:integrated:
    desc: Build with integrated and core-owned provider capabilities
    cmds:
      - go build -v -o crux-integrated{{exeExt}} -ldflags="-X github.com/example-git/crux/internal/config.DefaultProviderProfile=integrated" .

  build:plugin-compat:
    desc: Build with staged compatibility and native plugin support
    cmds:
      - go build -v -o crux-plugin-compat{{exeExt}} -ldflags="-X github.com/example-git/crux/internal/config.DefaultProviderProfile=plugin-compat" .

  build:plugin-native:
    desc: Build with native data-only plugins and core-owned capabilities
    cmds:
      - go build -v -o crux-plugin-native{{exeExt}} -ldflags="-X github.com/example-git/crux/internal/config.DefaultProviderProfile=plugin-native" .

  run:
    desc: Run build
    cmds:
      - task: build
      - "./crux{{exeExt}} {{.CLI_ARGS}} {{if .RACE}}2>race.log{{end}}"

  run:onboarding:
    desc: Run build with custom config to test onboarding
    env:
      CRUX_GLOBAL_DATA: tmp/onboarding/data
      CRUX_GLOBAL_CONFIG: tmp/onboarding/config
    cmds:
      - task: build
      - rm -rf tmp/onboarding
      - ./crux{{exeExt}} {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test -race -failfast ./... {{.CLI_ARGS}}

  test:record:
    desc: Run tests and record all VCR cassettes again
    aliases: [record]
    cmds:
      - rm -r internal/agent/testdata
      - go test -v -count=1 -timeout=1h ./internal/agent

  fmt:
    desc: Run gofumpt
    cmds:
      - gofumpt -w .

  fmt:html:
    desc: Run prettier on HTML/CSS/JS files
    cmds:
      - prettier --write internal/cmd/stats/index.html internal/cmd/stats/index.css internal/cmd/stats/index.js

  modernize:
    desc: Run modernize
    cmds:
      - go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix -test ./...

  dev:
    desc: Run with profiling enabled
    env:
      CRUX_PROFILE: true
    cmds:
      - go run .

  install:
    desc: Install the application
    vars:
      LDFLAGS: '{{if .VERSION}}-ldflags="-X github.com/example-git/crux/internal/version.Version={{.VERSION}}"{{end}}'
    cmds:
      - go install {{.LDFLAGS}} -v .
    sources:
      - ./**/*.go
      - go.mod
      - internal/agent/**/*.md
      - internal/agent/**/*.md.tpl

  profile:cpu:
    desc: 10s CPU profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/profile?seconds=10'

  profile:heap:
    desc: Heap profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/heap'

  profile:allocs:
    desc: Allocations profile
    cmds:
      - go tool pprof -http :6061 'http://localhost:6060/debug/pprof/allocs'

  schema:
    desc: Generate JSON schemas for configuration and provider plugins
    cmds:
      - go run main.go schema > schema.json
      - go run main.go schema provider-plugin > provider-plugin.schema.json
      - go run main.go schema provider-preset-plugin > provider-preset-plugin.schema.json
      - go run main.go schema image-provider-plugin > image-provider-plugin.schema.json
      - echo "Generated schema.json, provider-plugin.schema.json, provider-preset-plugin.schema.json, and image-provider-plugin.schema.json"
    generates:
      - schema.json
      - provider-plugin.schema.json
      - provider-preset-plugin.schema.json
      - image-provider-plugin.schema.json

  release:
    desc: Create and push an annotated semantic-version tag
    requires:
      vars: [VERSION]
    prompt: "This will release {{.VERSION}}. Continue?"
    preconditions:
      - sh: '[ $(git symbolic-ref --short HEAD) = "main" ]'
        msg: Not on main branch
      - sh: "[ $(git status --porcelain=2 | wc -l) = 0 ]"
        msg: "Git is dirty"
      - sh: 'printf %s "{{.VERSION}}" | grep -Eq "^v[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$"'
        msg: VERSION must be a semantic-version tag such as v1.2.3 or v1.2.3-rc.1
      - sh: 'gh run list --workflow build.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "Test build for this commit failed or not present"
      - sh: 'gh run list --workflow snapshot.yml --commit $(git rev-parse HEAD) --status success --json conclusion -q ".[0].conclusion" | grep -q success'
        msg: "Snapshot build for this commit failed or not present"
    cmds:
      - git fetch --tags
      - git tag --annotate -m "{{.VERSION}}" "{{.VERSION}}"
      - git push origin "{{.VERSION}}"

  swag:
    desc: Generate OpenAPI spec from swag annotations
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo main.go --dir . --output internal/swagger --packageName swagger --parseDependency --parseInternal --parseDepth 5
    sources:
      - internal/server/*.go
      - internal/proto/*.go
      - main.go
    generates:
      - internal/swagger/docs.go
      - internal/swagger/swagger.json
      - internal/swagger/swagger.yaml

  sqlc:
    desc: Generate code using SQLC
    cmds:
      - sqlc generate
