version: 2

project_name: crux

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - ./scripts/guard-goreleaser.sh
    - go mod tidy
    - sh -c 'rm -rf completions manpages && mkdir -p completions manpages'
    - sh -c 'go run . completion bash > completions/crux.bash'
    - sh -c 'go run . completion zsh > completions/crux.zsh'
    - sh -c 'go run . completion fish > completions/crux.fish'
    - sh -c 'go run . man | gzip -c > manpages/crux.1.gz'

builds:
  - id: crux
    binary: crux
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/example-git/crux/internal/version.Version={{ .Version }}

archives:
  - id: crux
    ids:
      - crux
    name_template: >-
      crux_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE.md
      - THIRD_PARTY_NOTICES.md
      - SECURITY.md
      - RELEASES.md
      - BRANDING.md
      - schema.json
      - provider-plugin.schema.json
      - provider-preset-plugin.schema.json
      - image-provider-plugin.schema.json
      - docs/provider-plugins/**/*
      - docs/compatibility/**/*
      - plugins/provider-presets/**/*
      - completions/*
      - manpages/*
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

release:
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^(build|ci|chore|docs|test)(\\(.+\\))?:"
      - "^Merge "
