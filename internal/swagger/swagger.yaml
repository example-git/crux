  /workspaces/{id}/events:
    get:
      description: The event stream claim must match accepted workspace authority.
        Client-owned attachment requires the exact mode/revision/digest from a retained
        creation or replacement acknowledgement. The response echoes the accepted
        tuple before events. A client UUID or public discovery result alone does not
        authorize attachment.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Accepted mode: client or server; required for client-owned attachment'
        in: header
        name: Crux-Workspace-Authority-Mode
        type: string
      - description: Exact accepted decimal revision; required with authority mode
        in: header
        name: Crux-Workspace-Authority-Revision
        type: string
      - description: Exact accepted runtime digest; required with authority mode
        in: header
        name: Crux-Workspace-Authority-Digest
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          headers:
