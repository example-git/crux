info:
  contact:
    name: Crux
    url: https://github.com/example-git/crux
  description: Crux is a terminal-based AI coding assistant. This API is served locally
    over a Unix socket or Windows named pipe, or remotely over TLS 1.3 with mutual
    certificate authentication. Authenticated remote workspace routes bind IDs to
    the verified client principal. Client-owned runtimes negotiate capabilities before
    private admission; public discovery never supplies private credentials for restoration.
    Enrollment and authorization administration are separate local operations.
  license:
    name: FSL-1.1-MIT
    url: https://github.com/example-git/crux/blob/main/LICENSE.md
  title: Crux API
  version: "1.0"
paths:
  /authorization:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connection.AuthorizationProof'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Current mutually authenticated client identity
      tags:
      - connection
  /clients/{client_id}:
    delete:
      parameters:
      - description: Client ID (UUID)
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Retire a client
      tags:
      - system
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get server config
      tags:
      - system
  /control:
    post:
      consumes:
      - application/json
      parameters:
      - description: Control command (e.g. shutdown, shutdown_if_idle)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.ServerControl'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Send server control command
      tags:
      - system
  /health:
    get:
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - system
  /plugins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.PluginSnapshot'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get provider plugins
      tags:
      - system
  /runtime-capabilities:
    get:
      description: Authenticate with the selected client certificate before sending
        private state. Returns the exact compiler, principal, limits, sharing policy
        and disconnect grace.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.RemoteRuntimeCapabilities'
        "400":
          description: Invalid request; authentication operations may instead return
            their request-bound response with an error
          schema:
            $ref: '#/definitions/proto.Error'
        "403":
          description: Principal is unauthorized or does not own this workspace
          schema:
            $ref: '#/definitions/proto.Error'
        "408":
          description: Request canceled
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Response unavailable; do not infer whether persistence or publication
            occurred
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Negotiate client runtime support
      tags:
      - runtime
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.VersionInfo'
      summary: Get server version
      tags:
      - system
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/proto.Workspace'
            type: array
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Client mode requires authenticated capability negotiation and a
        complete private runtime. Server mode is explicit for authenticated remote
        callers. Public workspace discovery is not reusable private authority.
      parameters:
      - description: Workspace creation and private authority
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.CreateWorkspaceRequest'
      - description: 'Required for client mode: negotiated runtime protocol'
        in: header
        name: Crux-Runtime-Protocol
        type: string
      - description: 'Required for client mode: nonempty private-state marker'
        in: header
        name: X-Crux-Ephemeral-State
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{id}:
    delete:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Delete workspace
      tags:
      - workspaces
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
