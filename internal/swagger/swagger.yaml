      bundle_digest:
        type: string
      config:
        $ref: '#/definitions/config.ProviderConfig'
      gemini_project_id:
        type: string
      native_identity:
        $ref: '#/definitions/config.NativeIdentity'
      unloaded:
        $ref: '#/definitions/config.ProviderLoadIssue'
    type: object
  config.RemoteRuntimeControls:
    properties:
      analysis_effort:
        type: string
      codex_compaction_v2:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disabled_instruction_sections:
        items:
          type: string
        type: array
      instruction_mode:
        type: string
      response_verbosity:
        type: string
      summarization_context_cap:
        type: integer
      summarization_fast_mode:
        type: boolean
      summarization_max_tokens:
        type: integer
    type: object
  config.RemoteRuntimeProposal:
    properties:
      bundles:
        items:
          $ref: '#/definitions/providerplugin.TransportBundle'
        type: array
      codebase_index:
        $ref: '#/definitions/config.RemoteCodebaseIndex'
      controls:
        $ref: '#/definitions/config.RemoteRuntimeControls'
      credential_environment:
        additionalProperties:
          type: string
        type: object
      credentials:
        items:
          $ref: '#/definitions/config.RemoteCredentialBinding'
        type: array
      digest:
        type: string
      image_browser_credentials:
        items:
          $ref: '#/definitions/config.RemoteImageBrowserCredential'
        type: array
      image_client_identities:
