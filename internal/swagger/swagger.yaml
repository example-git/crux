      max_items:
        type: integer
    type: object
  config.ConnectionProbeKind:
    enum:
    - not-probed
    - format-only
    - http-attempt
    - http-response
    - unsupported
    type: string
    x-enum-varnames:
    - ConnectionProbeNotProbed
    - ConnectionProbeFormatOnly
    - ConnectionProbeHTTPAttempt
    - ConnectionProbeHTTPResponse
    - ConnectionProbeUnsupported
  config.ConnectionProbePolicy:
    enum:
    - none
    - sk-prefix
    - http-200
    - non-401
    - manifest-http-200
    type: string
    x-enum-varnames:
    - ConnectionProbePolicyNone
    - ConnectionProbePolicySKPrefix
    - ConnectionProbePolicyHTTP200
    - ConnectionProbePolicyNon401
    - ConnectionProbePolicyManifestHTTP200
  config.ConnectionProbeResult:
    properties:
      authorization_overridden:
        type: boolean
      entered_key_in_authorization:
        description: |-
          Entered key means the resolved APIKey from the supplied ProviderConfig.
          These fields describe the initial request's construction, not delivery or
          headers on a redirected request. Any explicit Authorization override is
          reported conservatively even if its bytes happen to equal the entered key.
        type: boolean
      http_status:
        type: integer
      kind:
        $ref: '#/definitions/config.ConnectionProbeKind'
      policy:
        $ref: '#/definitions/config.ConnectionProbePolicy'
    type: object
  config.ForwardedAccount:
    properties:
      entry:
        $ref: '#/definitions/accounts.Entry'
      owner:
        $ref: '#/definitions/providerregistry.RegistrationOwner'
    type: object
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      name:
        description: Friendly display name shown in the TUI. Falls back to Command
          when empty.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.ImageConfiguration:
    properties:
      preferred:
        items:
          $ref: '#/definitions/providerplugin.ImageOwner'
        type: array
      providers:
        additionalProperties:
          $ref: '#/definitions/config.ImageProviderConfiguration'
        type: object
    type: object
  config.ImageProviderConfiguration:
    properties:
      browser_profiles:
        additionalProperties:
          type: string
        type: object
      configuration:
        additionalProperties: {}
        type: object
      credentials:
        additionalProperties:
          $ref: '#/definitions/providerregistry.RegistrationOwner'
        type: object
      owner:
        $ref: '#/definitions/providerplugin.ImageOwner'
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.LocalAuthenticationProgress:
    properties:
      account_refreshed:
        type: boolean
      accounts_saved:
        type: boolean
      config_saved:
        type: boolean
      runtime_published:
        type: boolean
    type: object
  config.LocalAuthenticationRepairResult:
    properties:
      abandoned:
        type: boolean
      accounts_matched:
        type: boolean
      accounts_written:
        type: boolean
      config_matched:
        type: boolean
      config_written:
        type: boolean
      needs_reload:
        type: boolean
      summary:
        $ref: '#/definitions/config.LocalAuthenticationSummary'
    type: object
  config.LocalAuthenticationSummary:
    properties:
      abandoned:
        type: boolean
      account_id:
        type: string
      action:
        type: string
      coherent:
        type: boolean
      finished:
        type: boolean
      needs_reload:
        type: boolean
      no_effects:
        type: boolean
      operation_id:
        type: string
      original:
        $ref: '#/definitions/config.LocalAuthenticationProgress'
      provider_id:
        type: string
      refresh_observed:
        type: boolean
      refresh_started:
        type: boolean
      removed_account_id:
        type: string
      repair_accounts_written:
        type: boolean
      repair_config_written:
        type: boolean
      repair_ready:
        type: boolean
      repair_started:
        type: boolean
      revision:
        type: integer
      workspace_id:
        type: string
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Crux picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      timeout:
        type: integer
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.NativeIdentity:
    properties:
      originator:
        type: string
      user_agent:
        type: string
      version:
        type: string
    type: object
  config.OwnedSelectedModel:
    properties:
      model:
        $ref: '#/definitions/config.SelectedModel'
      owner:
        $ref: '#/definitions/providerregistry.RegistrationOwner'
    type: object
  config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
    type: object
  config.ProviderConfig:
    properties:
      api_key:
        description: The provider's API key.
        type: string
      base_url:
        description: The provider's API endpoint.
        type: string
      configuration:
        additionalProperties: {}
        description: |-
          Configuration preserves declarative plugin configuration values. Values
          are validated against the active provider registry when that plugin is
          installed; missing-plugin values remain lossless and untouched.
        type: object
      disable:
        description: Marks the provider as disabled.
        type: boolean
      discover_models:
        description: |-
          AutoDiscoverModels controls model discovery via /v1/models endpoint.
          When Models is empty and this is nil or true, Crux auto-discovers
          models. When true and Models is non-empty, discovered models are
          merged in (user-specified models take precedence). When false,
          only explicitly listed models are used.
        type: boolean
      extra_body:
        additionalProperties: {}
        description: |-
          ExtraBody is merged verbatim into OpenAI-compatible request
          bodies. String values are NOT shell-expanded: this is a plain
          JSON passthrough so that arbitrary provider-extension fields
          (numbers, nested objects, booleans) round-trip without a
          recursive walker guessing at intent. If you need an env-var-
          driven value at request time, put it in extra_headers, or in
          the provider's top-level api_key / base_url, all of which do
          expand.
        type: object
      extra_headers:
        additionalProperties:
          type: string
        description: |-
          Extra headers to send with each request to the provider. Values
          run through shell expansion at config-load time, so $VAR and
          $(cmd) work the same way they do in MCP headers. A header whose
          value resolves to the empty string (unset bare $VAR under
          lenient nounset, $(echo), or literal "") is omitted from the
          outgoing request rather than sent as "Header:".
        type: object
      flat_rate:
        description: Skip cost accumulation for this provider when using subscription
          or flat rate billing.
        type: boolean
      id:
        description: The provider's id.
        type: string
      models:
        description: The provider models
        items:
          $ref: '#/definitions/catalog.Model'
        type: array
      name:
        description: The provider's name, used for display purposes.
        type: string
      oauth:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: OAuthToken for providers that use OAuth2 authentication.
      owner:
        allOf:
        - $ref: '#/definitions/config.ProviderOwnerReference'
        description: |-
          Plugin records durable ownership so configuration and selections remain
          unavailable rather than falling through to a generic provider when the
          bundle is missing, disabled, invalid, incompatible, or untrusted.
      plugin:
        $ref: '#/definitions/config.ProviderPluginReference'
      preset:
        $ref: '#/definitions/config.ProviderPresetReference'
      provider_options:
        additionalProperties: {}
        type: object
      system_prompt_prefix:
        description: Custom system prompt prefix.
        type: string
      tooling_instructions:
        description: Tooling instruction profile used for this provider.
        type: string
      type:
        allOf:
        - $ref: '#/definitions/catalog.Type'
        description: |-
          The provider type. Empty custom-provider types default to openai-compat;
          registered local aliases use the same protocol.
    type: object
  config.ProviderLoadIssue:
    properties:
      message:
        type: string
      plugin_id:
        type: string
      provider_id:
        type: string
      version:
        type: string
    type: object
  config.ProviderOwnerReference:
    properties:
      compatibility_adapter:
        $ref: '#/definitions/providerregistry.Construction'
      construction:
        $ref: '#/definitions/providerregistry.Construction'
      type:
        $ref: '#/definitions/config.ProviderOwnerType'
    type: object
  config.ProviderOwnerType:
    enum:
    - core
    - custom
    - plugin
    - preset
    type: string
    x-enum-varnames:
    - ProviderOwnerCore
    - ProviderOwnerCustom
    - ProviderOwnerPlugin
    - ProviderOwnerPreset
  config.ProviderPluginReference:
    properties:
      id:
        type: string
      version:
        type: string
    type: object
  config.ProviderPresetReference:
    properties:
      digest:
        type: string
      id:
        type: string
      version:
        type: string
    type: object
  config.ProviderUsageRequest:
    properties:
      digest:
        type: string
      owner:
        $ref: '#/definitions/providerregistry.RegistrationOwner'
