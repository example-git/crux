  csync.Map-string-config_ProviderConfig:
    type: object
  github_com_example-git_crux_internal_config.Config:
    properties:
      $schema:
        type: string
      env:
        additionalProperties:
          type: string
        description: Env is a map of environment variables set on startup.
        type: object
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      images:
        $ref: '#/definitions/config.ImageConfiguration'
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      models:
        additionalProperties:
          $ref: '#/definitions/config.SelectedModel'
        description: We currently only support large/small as values here.
        type: object
      options:
        $ref: '#/definitions/github_com_example-git_crux_internal_config.Options'
      permissions:
        $ref: '#/definitions/config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/config.SelectedModel'
          type: array
        description: Recently used models stored in the data directory config.
        type: object
      remote_codebase_indexes:
        additionalProperties:
          $ref: '#/definitions/config.ToolCodebaseSearch'
        type: object
      tools:
        $ref: '#/definitions/config.Tools'
    type: object
  github_com_example-git_crux_internal_config.Options:
    properties:
      analysis_effort:
        type: string
      auto_lsp:
        type: boolean
      codex_compaction_v2:
        type: boolean
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Crux keeps per-project state such as
          the SQLite database and workspace overrides. Relative paths are
          resolved against the working directory; absolute paths are used
          verbatim. After defaulting the stored value is always absolute.
        type: string
