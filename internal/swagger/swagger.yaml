basePath: /v1
definitions:
  accounts.Entry:
    properties:
      accessToken:
        type: string
      displayName:
        type: string
      expiresAt:
        description: ExpiresAt is epoch milliseconds, matching the reference schema.
        type: integer
      id:
        type: string
      raw:
        items:
          type: integer
        type: array
      refreshToken:
        type: string
    type: object
  catalog.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      id:
        type: string
      name:
        type: string
      options:
        $ref: '#/definitions/catalog.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_attachments:
        type: boolean
    type: object
  catalog.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  catalog.Type:
    enum:
    - openai
    - openai-compat
    - openrouter
    - vercel
    - anthropic
    - google
    - azure
    - bedrock
    - google-vertex
    type: string
    x-enum-varnames:
    - TypeOpenAI
    - TypeOpenAICompat
    - TypeOpenRouter
    - TypeVercel
    - TypeAnthropic
    - TypeGoogle
    - TypeAzure
    - TypeBedrock
    - TypeVertexAI
  config.AgentModelState:
    properties:
      large:
        $ref: '#/definitions/config.OwnedSelectedModel'
      small:
        $ref: '#/definitions/config.OwnedSelectedModel'
    type: object
  config.ClientRefreshCompletion:
    properties:
      credential_id:
        type: string
      digest:
        type: string
      failed:
        type: boolean
      request_id:
        type: string
      revision:
        type: integer
    type: object
  config.Completions:
    properties:
      max_depth:
